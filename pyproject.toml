[project]
name = "doro"
version = "0.1.0"
description = "Desktop pet application with state management and chat functionality"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
]

[project.optional-dependencies]
automation = [
    "pynput>=1.7.6",
]
web = [
    "websockets>=15,<18",
    "playwright>=1.40.0",
    "tavily-python>=0.5.0",
    "ddgs>=6.0.0",
]
a11y = [
    "uiautomation>=2.0; sys_platform == 'win32'",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-qt>=4.2.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-qt>=4.2.0",
    # Pin the formatter/linter exactly so local and CI always agree. An
    # unpinned ruff silently upgraded (0.15 -> 0.16) and its expanded default
    # rule set turned CI red with no code change; bump these deliberately.
    "black==26.3.1",
    "ruff==0.16.8",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["doro_app*"]

[tool.setuptools.package-data]
doro_app = ["**/*.json", "**/*.txt", "**/*.gif", "**/*.apng", "**/*.webp", "**/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=doro_app",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["doro_app"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Ruff 0.16 enabled several opinionated families by default. This is a
# defensive Qt desktop app that deliberately uses broad `except Exception`
# guards (many marked "defensive") and best-effort try/except paths, so the
# behavioral rules below are noise here, not bugs. Everything else in the
# default set (import sorting, dead-code, simplifications, RUF cleanups, ...)
# stays enforced.
ignore = [
    "BLE001",  # blind-except: broad Exception guards are intentional
    "S110",    # try-except-pass: intentional best-effort / optional paths
    "S112",    # try-except-continue: same
    "TRY002",  # raise vanilla Exception (test helper)
    "TRY004",  # prefer TypeError: the existing ValueError style is deliberate
    "G201",    # logging exc_info style choice
    "EXE001",  # shebang without +x on manual scripts (run via `python`)
    "DTZ005",  # naive local datetime is fine for this desktop app
]
