[project]
name = "doro"
version = "0.1.0"
description = "Desktop pet application with state management and chat functionality"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
    "anthropic>=0.18.0",
]

[project.optional-dependencies]
automation = [
    "pynput>=1.7.6",
]
web = [
    "websockets>=15,<18",
    "playwright>=1.40.0",
    "tavily-python>=0.5.0",
    "ddgs>=6.0.0",
]
a11y = [
    "uiautomation>=2.0; sys_platform == 'win32'",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-qt>=4.2.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-qt>=4.2.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["doro_app*"]

[tool.setuptools.package-data]
doro_app = ["**/*.json", "**/*.txt", "**/*.gif", "**/*.apng", "**/*.webp", "**/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=doro_app",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["doro_app"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"
