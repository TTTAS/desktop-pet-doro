[project]
name = "doro"
version = "0.1.0"
description = "Desktop pet application with state management and chat functionality"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5.0",
    "anthropic>=0.18.0",
]

[project.optional-dependencies]
automation = [
    "pynput>=1.7.6",
]
a11y = [
    "uiautomation>=2.0; sys_platform == 'win32'",
]
test = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-qt>=4.2.0",
]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-qt>=4.2.0",
    "black==26.5.1",
    "ruff==0.16.5",
]

[build-system]
requires = ["setuptools>=68.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["doro_app"]

[tool.setuptools.package-data]
doro_app = ["**/*.json", "**/*.txt", "**/*.gif", "**/*.apng", "**/*.webp", "**/*.png"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "-v",
    "--strict-markers",
    "--cov=doro_app",
    "--cov-report=term-missing",
    "--cov-report=html",
]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
]

[tool.coverage.run]
source = ["doro_app"]
omit = [
    "*/tests/*",
    "*/__pycache__/*",
    "*/venv/*",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
# Pin the classic default rule set (pyflakes + a subset of pycodestyle).
# Without this, `ruff check` inherits whatever the installed ruff version
# happens to default to, which has since broadened to include opinionated
# rules (isort, pyupgrade, flake8-blind-except, ...) the project never
# opted into — turning every CI run red on lint. Pinning keeps linting
# stable across ruff upgrades.
select = ["E4", "E7", "E9", "F"]
