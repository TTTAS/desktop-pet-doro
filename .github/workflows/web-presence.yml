name: Web and presence acceptance

on:
  push:
    branches: ["fix/web-replies-presence"]
  pull_request:
    branches: ["fix/verify-skip-blocked-pages"]

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[test,web]"
      - run: python -m playwright install chromium
      - name: Unit and Qt integration tests
        run: python -m pytest tests --ignore=tests/manual -o addopts= -q
      - name: Chromium extension acceptance
        env:
          DORO_BROWSER_TESTS: "1"
        run: python -m pytest tests/browser -o addopts= -q
