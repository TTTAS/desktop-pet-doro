name: Repository map

# 只手動觸發，不在每次 push / PR 自動跑（節省 Actions 用量）。
on: [workflow_dispatch]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python scripts/repo_map.py --check
      - run: python -m unittest discover -s tests/tools -p test_repo_map.py
