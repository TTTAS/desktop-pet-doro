[mypy]
# Mypy configuration for Doro desktop pet application

# Strict mode - enable all optional error checking
python_version = 3.11
strict = True
warn_return_any = True
warn_unused_configs = True
warn_redundant_casts = True
warn_unused_ignores = True
disallow_any_generics = True
disallow_untyped_defs = True
disallow_untyped_calls = True
disallow_incomplete_defs = True
check_untyped_defs = True
disallow_untyped_decorators = True
no_implicit_optional = True
warn_unreachable = True
strict_equality = True
show_error_codes = True

# Target specific modules for strict checking
[mypy-doro_app.state_service]
strict = True

[mypy-doro_app.state_models]
strict = True

[mypy-doro_app.state_repository]
strict = True

# Ignore missing imports for third-party libraries
[mypy-PySide6.*]
ignore_missing_imports = True

[mypy-pytest.*]
ignore_missing_imports = True
