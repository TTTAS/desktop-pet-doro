[pytest]
# Pytest configuration for Doro desktop pet

# Test discovery patterns
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Directories to search for tests
testpaths = tests

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --color=yes
    -ra

# Markers for categorizing tests
markers =
    unit: Unit tests (fast, isolated)
    integration: Integration tests (slower, use real resources)
    slow: Slow tests (> 1 second)

# Minimum Python version
minversion = 3.8
